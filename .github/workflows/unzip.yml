name: Unzip Patch
on:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - '.github/workflows/unzip.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip all root zip patches
        run: |
          shopt -s nullglob
          for f in *.zip; do
            echo "Unzipping $f..."
            unzip -o "$f"
            rm -f "$f"
          done
      - name: Commit and push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Apply recording v1 patch"
            git push
          fi
