name: Fix Preview Type
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sed -i 's/"dm" | "teleapo" | null/"dm" | "email" | "teleapo" | null/g' src/components/PublicPreviewShell.tsx
          rm -f .github/workflows/unzip.yml
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Fix insightCopiedMode type" || true
          git push
