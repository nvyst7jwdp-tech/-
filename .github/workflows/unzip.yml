name: Unzip Source
on:
  push:
    paths:
      - '.github/workflows/unzip.yml'
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o gurupo_firebase_base.zip
          rm -f gurupo_firebase_base.zip .github/workflows/unzip.yml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Extract gurupo firebase source"
          git push
