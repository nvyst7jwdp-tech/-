name: Organize Real Home Patch
on:
  push:
    paths:
      - '.github/workflows/unzip.yml'
permissions:
  contents: write
jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p src/services src/components
          [ -f TodayScreen.tsx ] && mv -f TodayScreen.tsx src/components/TodayScreen.tsx
          [ -f homeDataService.ts ] && mv -f homeDataService.ts src/services/homeDataService.ts
          rm -f gurupo_firebase_real_home_patch.zip .github/workflows/unzip.yml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Move real home files into src/" || true
          git push
