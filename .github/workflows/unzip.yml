name: Place Patch Files
on: push
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p src/components src/services
          for f in CustomerMap.tsx StoresScreen.tsx SalesInsightPanel.tsx PublicPreviewShell.tsx; do
            [ -f "$f" ] && mv "$f" src/components/
          done
          for f in placesService.ts geminiSalesService.ts; do
            [ -f "$f" ] && mv "$f" src/services/
          done
          rm -f .github/workflows/unzip.yml
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Apply sales insight and store scope updates" || true
          git push
