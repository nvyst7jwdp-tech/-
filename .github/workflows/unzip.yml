name: Place Stores V6 Files
on: push
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p src/components src/services
          for f in CustomerMap.tsx StoresScreen.tsx PublicPreviewShell.tsx; do
            [ -f "$f" ] && mv -f "$f" src/components/
          done
          [ -f "storesService.ts" ] && mv -f storesService.ts src/services/
          rm -f .github/workflows/unzip.yml
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Apply stores v6 updates" || true
          git push
