name: Place Auth Fix Files
on: push
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p src/lib src/services
          [ -f "firebase.ts" ] && mv -f firebase.ts src/lib/
          [ -f "authService.ts" ] && mv -f authService.ts src/services/
          rm -f .github/workflows/unzip.yml
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Fix auth permissions and Google account picker" || true
          git push
