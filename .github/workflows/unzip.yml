name: Remove Leftover SVG Lines
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sed -i '815,817d' src/components/PublicPreviewShell.tsx
          rm -f .github/workflows/unzip.yml
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Remove leftover SVG closing lines" || true
          git push
